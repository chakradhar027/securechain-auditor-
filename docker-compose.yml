version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: securechain_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: securechain_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securechain_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securechain_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/securechain_db
      - APP_ENV=production
      - DEBUG=False
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - STORAGE_DIR=/app/storage
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./contracts:/app/contracts
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securechain_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  mythril:
    image: mythril/myth:latest
    container_name: securechain_mythril
    restart: "no"
    volumes:
      - ./contracts:/contracts
      - ./storage:/storage
    entrypoint: ["myth"]

volumes:
  postgres_data:

